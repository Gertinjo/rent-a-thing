# CI/CD for Rentify
#   every push / PR : backend tests + dependency audit, app typecheck + web build, Docker build
#   push to main    : the Docker image is also pushed to GitHub Container Registry (ghcr.io)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      AI_DISABLED: "1"
      RATE_LIMIT_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      - name: Compile check
        run: python -m compileall -q app
      - name: Tests
        run: python -m pytest -q
      - name: Known-vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  mobile:
    name: App · typecheck + web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: npm audit (high+ in production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # Expo pulls many transitive deps; report, don't block the hackathon build
      - name: Web build
        run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: mobile/dist
          retention-days: 7

  docker:
    name: Docker image
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deploy step goes here (Render / Fly.io / a VPS pulling the image). Keep SECRET_KEY,
      # GEMINI_API_KEY etc. in the host's secret store, never in the repo.
